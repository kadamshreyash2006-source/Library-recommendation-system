{% extends 'base.html' %}
{% block title %}My library{% endblock %}
{% block content %}
<div class="page-head">
  <h1>My library</h1>
  <p>Everything you have saved or rated. Each book here shapes your recommendations.</p>
</div>

<div class="tabs" id="tabs"></div>
<div class="toolbar">
  <span class="muted" id="count"></span>
  <label class="muted" style="font-size:13px">Sort
    <select id="sort">
      <option value="recent">Recently added</option>
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="rating">Your rating</option>
    </select>
  </label>
</div>
<div class="grid" id="grid"></div>
{% endblock %}

{% block scripts %}
<script>
let DATA = null, tab = 'all';
const grid = document.getElementById('grid');

function list(){
  if (!DATA) return [];
  let rows = tab === 'rated' ? DATA.rated
           : tab === 'all' ? DATA.library
           : DATA.library.filter(b => b.shelf === tab);
  const s = document.getElementById('sort').value;
  rows = rows.slice();
  if (s === 'title') rows.sort((a, b) => a.title.localeCompare(b.title));
  else if (s === 'author') rows.sort((a, b) => a.author.localeCompare(b.author));
  else if (s === 'rating') rows.sort((a, b) => (b.user_rating || 0) - (a.user_rating || 0));
  return rows;
}

function draw(){
  const counts = {all: DATA.library.length, rated: DATA.rated.length};
  for (const [k] of LIB.shelfOrder) counts[k] = DATA.library.filter(b => b.shelf === k).length;
  const tabs = [['all','All saved'], ...LIB.shelfOrder, ['rated','Rated']];
  document.getElementById('tabs').innerHTML = tabs.map(([k, l]) =>
    `<button class="${k === tab ? 'on' : ''}" data-tab="${k}">${esc(l)}<span class="n">${counts[k]}</span></button>`).join('');
  const rows = list();
  document.getElementById('count').textContent = rows.length + ' book' + (rows.length === 1 ? '' : 's');
  grid.innerHTML = rows.length ? rows.map(b => tileHTML(b)).join('') :
    `<div style="grid-column:1/-1" class="callout"><p>${tab === 'rated' ? 'You have not rated any books yet.' : 'Nothing on this shelf yet.'}
     Find books on your <a href="/" style="color:var(--brass)">For you</a> page or with <a href="/discover" style="color:var(--brass)">Discover</a>.</p></div>`;
}

async function load(){
  grid.innerHTML = skeletonGrid(6);
  DATA = await api('/api/library');
  draw();
}
document.getElementById('tabs').onclick = e => {
  const b = e.target.closest('button[data-tab]');
  if (b){ tab = b.dataset.tab; draw(); }
};
document.getElementById('sort').onchange = draw;
// Moving or removing a book changes which tab it belongs to: reload quietly.
document.addEventListener('book-updated', () => api('/api/library').then(d => { DATA = d; draw(); }));
load();
</script>
{% endblock %}
